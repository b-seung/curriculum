<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
  <div layout:fragment="content">
    <form>
      <div class="body">
        <div class="mb-3">
          <label class="text-lg label-hd">パスワード再設定</label>
        </div>
        <div th:replace="fragments/errormsg :: errormsg"></div>
        <div class="mb-5 label-center">新しいパスワードを入力してください。</div>
        <div class="mb-3 flex label-center">
          <label for="password" class="text-base form-label required">パスワード</label>
          <input id="password" name="password" type="password" class="form-input w-medium" maxlength="64" />
        </div>
        <div class="mb-5 flex label-center">
          <label for="passwordConfirm" class="text-base form-label">パスワード確認</label>
          <div class="flex column">
            <input id="passwordConfirm" type="password" class="form-input w-medium" maxlength="64" />
            <p id="error-passwordConfirm" class="error-msg text-sm hidden"></p>
          </div>
        </div>
        <div class="mt-7 flex row bt-box">
          <button id="back" type="button">戻る</button>
          <button id="next" type="button" class="blue">次へ</button>
        </div>
      </div>
    </form>
    <script>
      // 初期処理
      $(window).on('load', function () {});

      // 戻るボタンクリックイベント
      $('#back').click(() => {
        postData('/password/back', {}, (res) => {
          if (res.url != '' && res.url != null) {
            location.href = res.url;
          }
        });
      });

      // 次へボタンクリックイベント
      $('#next').click(() => {
        let params = getForm($('form'));

        postData('/password/ok', params, (res) => {
          if (res.url != '' && res.url != null) {
            location.href = res.url;
          }
        });
      });

      $('#password').focusout((e) => {
        errorClear();

        if (e.target.value != $('#passwordConfirm').val() && $('#passwordConfirm').val() != '') {
          setErrorMsg('passwordConfirm', 'パスワードと一致しません。');
        }
      });

      $('#passwordConfirm').keyup((e) => {
        errorClear();

        if (e.target.value != '' && e.target.value != $('#password').val() && $('#password').val() != '') {
          setErrorMsg('passwordConfirm', 'パスワードと一致しません。');
        }
      });
    </script>
    <style>
      .form-label {
        width: 150px;
        margin-left: 30px;
      }

      .label-center {
        align-items: center;
      }

      .bt-box {
        justify-content: space-between;
      }
      .bt-box button {
        max-width: 300px;
        width: calc(100% / 3 - 10px);
      }
    </style>
  </div>
</html>
