<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
  <div layout:fragment="content">
    <form action="loging" method="post">
      <div class="box">
        <div class="mb-2">
          <label for="username" class="text-base">id</label>
          <input id="id" name="username" type="text" class="form-input w-medium" required />
        </div>
        <div class="mb-2 eye close">
          <label for="password" class="text-base">password</label>
          <input id="password" name="password" type="password" class="form-input w-medium" required />
        </div>
        <div>
          <button type="submit">ログイン</button>
          <button type="button" id="joinBtn">会員登録</button>
        </div>
      </div>
    </form>
    <script>
      $('.eye').click((e) => {
        if (!$(e.target).hasClass('eye')) {
          return;
        }

        $('.eye').toggleClass('close');

        if ($('.eye').hasClass('close')) {
          $('.eye').removeClass('open');
          $('#password').attr('type', 'password');
        } else {
          $('.eye').addClass('open');
          $('#password').attr('type', 'text');
        }
      });

      $('#joinBtn').click((e) => {
        location.href = '/join';
      });
    </script>
    <style>
      .box {
        width: fit-content;
        margin: auto;
        padding: 30px;
      }
      .open::after,
      .close::after {
        content: '';
        width: 20px;
        height: 20px;
        position: absolute;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        display: inline-block;
        cursor: pointer;
        margin-left: -30px;
        margin-top: 5px;
        opacity: 0.5;
      }
      .open::after {
        background-image: url('../img/eye-open.png');
      }
      .close::after {
        background-image: url('../img/eye-close.png');
      }
    </style>
  </div>
</html>
