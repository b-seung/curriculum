<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
  <div layout:fragment="content">
    <form action="loging" method="post">
      <div class="box">
        <div class="mb-2">
          <label for="username" class="text-base">id</label>
          <input id="id" name="username" type="text" class="form-input w-medium" />
          <p id="error-id" class="error-msg text-sm"></p>
        </div>
        <div class="mb-2">
          <label for="password" class="text-base">password</label>
          <div class="eye close">
            <input id="password" name="password" type="password" class="form-input w-medium" />
          </div>
          <p id="error-password" class="error-msg text-sm"></p>
        </div>
        <div class="t-r">
          <a href="/password/reset" class="text-xs">パスワードをお忘れの方はこちら</a>
        </div>
        <div class="mt-5">
          <button type="submit" class="mb-2 blue">ログイン</button>
          <button type="button" id="joinBtn">会員登録</button>
        </div>
      </div>
    </form>
    <script>
      $("p[id^='error-']").each((index, elem) => {
        $(elem).addClass('hidden');
      });

      $('.eye').click((e) => {
        if (!$(e.target).hasClass('eye')) {
          return;
        }

        $('.eye').toggleClass('close');

        if ($('.eye').hasClass('close')) {
          $('.eye').removeClass('open');
          $('#password').attr('type', 'password');
        } else {
          $('.eye').addClass('open');
          $('#password').attr('type', 'text');
        }
      });

      $('#joinBtn').click((e) => {
        location.href = '/join';
      });

      $('form').submit((e) => {
        event.preventDefault();
        errorClear();

        if ($('#id').val() == '' || $('#password').val() == '') {
          if ($('#id').val() == '') {
            setErrorMsg('id', 'idを入力してください');
          }

          if ($('#password').val() == '') {
            setErrorMsg('password', 'passwordを入力してください');
          }

          return false;
        }

        let params = getForm($('form'));

        $.ajax({
          url: '/loging',
          type: 'POST',
          dataType: 'json',
          data: params,
          success: function (res) {
            if (res.status == '200') {
              location.href = '/home';
            } else {
              alert(decodeURI(res.message));
            }
          },
          error: function (request, status, error) {
            console.log(error);
          },
        });
      });
    </script>
    <style>
      .box {
        width: fit-content;
        margin: auto;
        padding: 30px;
      }
      .open::after,
      .close::after {
        content: '';
        width: 20px;
        height: 20px;
        position: absolute;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        display: inline-block;
        cursor: pointer;
        margin-left: -30px;
        margin-top: 5px;
        opacity: 0.5;
      }
      .open::after {
        background-image: url('../img/eye-open.png');
      }
      .close::after {
        background-image: url('../img/eye-close.png');
      }
      a {
        text-decoration: none;
        color: gray;
      }
    </style>
  </div>
</html>
