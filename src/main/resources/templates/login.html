<!DOCTYPE html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課題</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css" />
  </head>
  <body>
    <header id="header"></header>
    <form action="login">
      <div class="box">
        <div class="mb-2">
          <label for="id" class="text-base">id</label>
          <input id="id" name="id" type="text" class="form-input w-medium" required />
        </div>
        <div class="mb-2 eye close">
          <label for="password" class="text-base">password</label>
          <input id="password" name="password" type="password" class="form-input w-medium" required />
        </div>
        <div>
          <button type="submit">ログイン</button>
          <button type="button">会員登録</button>
        </div>
      </div>
    </form>
    <script layout:fragment="script" type="text/javascript" src="/lib/jquery-3.7.1.min.js"></script>
    <script>
      $('#header').load('../header.html');

      $('.eye').click((e) => {
        if (!$(e.target).hasClass('eye')) {
          return;
        }

        $('.eye').toggleClass('close');

        if ($('.eye').hasClass('close')) {
          $('.eye').removeClass('open');
          $('#password').attr('type', 'password');
        } else {
          $('.eye').addClass('open');
          $('#password').attr('type', 'text');
        }
      });
    </script>
    <style>
      .box {
        width: fit-content;
        margin: auto;
        padding: 30px;
      }
      .open::after,
      .close::after {
        content: '';
        width: 20px;
        height: 20px;
        position: absolute;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        display: inline-block;
        cursor: pointer;
        margin-left: -30px;
        margin-top: 5px;
        opacity: 0.5;
      }
      .open::after {
        background-image: url('../img/eye-open.png');
      }
      .close::after {
        background-image: url('../img/eye-close.png');
      }
    </style>
  </body>
</html>
